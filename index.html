<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f2c34">
<title>📱 iOS AU Simulator</title>

<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #1f2c34;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button { font: inherit; cursor: pointer; color: inherit; }

.phone-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 94vh;
    height: 94dvh;
    min-height: 500px;
    overflow: hidden;
    border: 7px solid #2d2d2d;
    border-radius: 38px;
    box-shadow: 0 15px 35px #0009;
    background:
        radial-gradient(ellipse at 15% 15%, #8ca9bd, transparent 40%),
        radial-gradient(ellipse at 85% 70%, #526f89, transparent 45%),
        linear-gradient(145deg, #344b62, #101b2b);
}

.dynamic-island {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 28px;
    background: #000;
    border-radius: 20px;
    z-index: 100;
}

.status-bar {
    position: absolute;
    z-index: 99;
    top: 12px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.active-screen { display: flex; }

/* LOCK SCREEN */
.lock-time {
    text-align: center;
    margin-top: 65px;
    text-shadow: 0 2px 8px #0003;
}

.lock-time h1 {
    font-size: clamp(62px, 17vw, 78px);
    font-weight: 300;
    letter-spacing: -3px;
    margin: 0;
}

.lock-time p { margin: 5px 0; }

.notification-center {
    margin-top: auto;
    padding: 18px;
}

.section-label {
    font-size: 11px;
    font-weight: 700;
    margin: 0 0 8px 4px;
}

.ios-notification {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px;
    text-align: left;
    border: 1px solid #ffffff20;
    border-radius: 20px;
    background: #ffffff30;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    animation: pulse 2.5s infinite;
}

.notif-icon {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: #25D366;
    font-size: 22px;
}

.notif-content h4 { margin: 0 0 4px; font-size: 13px; }
.notif-content p { margin: 0; font-size: 12px; line-height: 1.4; }

.swipe-hint {
    text-align: center;
    padding: 15px 10px 40px;
    font-size: 12px;
    cursor: pointer;
}

/* PASSCODE */
#passcode-screen {
    align-items: center;
    justify-content: center;
    background: #10182099;
    backdrop-filter: blur(30px);
    -webkit-backdrop-filter: blur(30px);
}

.passcode-heading {
    margin: 30px 0 15px;
    text-align: center;
}

.passcode-heading h2 { font-size: 21px; font-weight: 500; margin: 0; }

#passcode-error {
    color: #ffb0b0;
    font-size: 12px;
    height: 17px;
    margin: 7px 0 0;
}

.dots-container { display: flex; gap: 17px; margin-bottom: 27px; }
.dot { width: 12px; height: 12px; border: 1.5px solid white; border-radius: 50%; }
.dot.filled { background: white; }

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 68px);
    gap: 12px 22px;
    justify-content: center;
}

.key {
    width: 68px;
    height: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: #ffffff25;
    font-size: 26px;
}

.key:active { background: #ffffff55; }
.key span { font-size: 8px; letter-spacing: 1px; }
.key-delete { background: transparent; font-size: 12px; }

/* HOME SCREEN */
#home-screen { padding: 58px 15px 32px; }

.widget-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 23px;
}

.ios-widget {
    height: 120px;
    padding: 13px;
    border-radius: 19px;
    box-shadow: 0 4px 12px #0003;
}

.widget-date { background: #fff; color: #222; }
.widget-date .day { color: #ff3b30; font-size: 12px; font-weight: 600; }
.widget-date .date { font-size: 49px; font-weight: 300; line-height: 1.1; }
.widget-weather { background: #344c62; }
.widget-weather .title { font-size: 12px; }
.widget-weather .temp { font-size: 27px; margin: 6px 0; }
.widget-weather .desc { font-size: 10px; color: #ddd; }

.app-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 20px 8px;
}

.app-icon-wrapper {
    display: flex;
    min-width: 0;
    flex-direction: column;
    align-items: center;
    padding: 0;
    border: 0;
    background: transparent;
}

.app-icon {
    width: clamp(45px, 13vw, 56px);
    height: clamp(45px, 13vw, 56px);
    display: grid;
    place-items: center;
    border-radius: 14px;
    margin-bottom: 5px;
    box-shadow: 0 4px 9px #0004;
    font-size: 27px;
}

.app-name {
    font-size: 10px;
    text-align: center;
    text-shadow: 1px 1px 4px #000;
}

.icon-photos { background: white; }
.icon-mail { background: #5ac8fa; }
.icon-weather { background: #54c7fc; }
.icon-calendar { background: white; color: #ff3b30; }
.icon-notes { background: #ffcc00; }
.icon-maps { background: #e8f4e7; }
.icon-x { background: black; }
.icon-settings { background: #8e8e93; }
.icon-camera { background: #e5e5ea; color: #333; }
.icon-clock { background: black; }
.icon-journal { background: #e5f3ff; color: #007aff; }
.icon-instagram { background: linear-gradient(45deg,#f09433,#dc2743,#bc1888); }
.icon-phone { background: #4cd964; }
.icon-safari { background: white; }
.icon-wa { background: #25D366; }
.icon-music { background: linear-gradient(#ff2d55,#ff3b30); }

.ios-dock {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 10px;
    margin-top: auto;
    background: #ffffff35;
    border-radius: 22px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

/* APP WINDOW */
#app-window { z-index: 50; background: #0b141a; }

.app-header {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    padding: 39px 14px 12px;
    background: #202c33;
    border-bottom: 1px solid #34414a;
}

.btn-back {
    border: 0;
    background: transparent;
    color: #00a884;
    font-size: 14px;
}

.app-header-title { flex: 1; font-size: 15px; font-weight: 600; }

#app-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 15px;
}

#app-content.light-mode { background: #f4f4f4; color: #222; }

.chat-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 11px;
    padding: 15px;
    background: #0b141a;
}

.bubble {
    max-width: 85%;
    padding: 9px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.incoming { align-self: flex-start; background: #202c33; border-top-left-radius: 2px; }
.outgoing { align-self: flex-end; background: #005c4b; border-top-right-radius: 2px; }
.system { align-self: center; background: #182229; color: #a6b2ba; font-size: 11px; text-align: center; }

.chat-input-area {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    max-height: 38%;
    overflow-y: auto;
    padding: 12px;
    margin-bottom: 20px;
    background: #111b21;
    border-top: 1px solid #2f3b43;
}

.wa-btn {
    padding: 11px;
    text-align: left;
    line-height: 1.4;
    font-size: 12px;
    color: #e9edef;
    background: #202c33;
    border: 1px solid #3d4a54;
    border-radius: 9px;
}

.wa-btn:active { background: #354650; }

.info-card {
    padding: 15px;
    margin-bottom: 12px;
    color: #222;
    background: #fff;
    border-radius: 15px;
}

.info-card h3 { margin: 0 0 8px; font-size: 15px; }
.info-card p { font-size: 13px; line-height: 1.5; margin: 5px 0; }

.note-paper {
    min-height: 180px;
    padding: 16px;
    color: #443d2d;
    background: #fff5cc;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.photo-placeholder {
    display: grid;
    place-items: center;
    aspect-ratio: 1;
    margin-bottom: 10px;
    border-radius: 12px;
    background: linear-gradient(135deg,#d8e1ea,#8ba0b3);
    font-size: 55px;
}

.setting-row {
    padding: 13px;
    margin-bottom: 8px;
    color: #222;
    background: white;
    border-radius: 10px;
    font-size: 13px;
}

.home-bar {
    position: absolute;
    z-index: 120;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 115px;
    height: 5px;
    border-radius: 5px;
    background: white;
    cursor: pointer;
}

@keyframes pulse {
    50% { transform: scale(1.015); }
}

@media (max-width: 480px) {
    body { background: #101820; }
    .phone-container {
        width: 100%;
        max-width: none;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
    }
}

@media (max-height: 680px) {
    .lock-time { margin-top: 55px; }
    .lock-time h1 { font-size: 60px; }
    .ios-widget { height: 95px; }
    .widget-date .date { font-size: 38px; }
    .app-grid { gap: 12px 8px; }
    .keypad { gap: 8px 18px; }
    .key { width: 58px; height: 58px; }
}
</style>
</head>

<body>
<div class="phone-container">

    <div class="status-bar">
        <span id="status-time">16:53</span>
        <span>● ▮▮▮  Wi-Fi ▰</span>
    </div>

    <div class="dynamic-island"></div>

    <!-- LOCK SCREEN -->
    <section id="lock-screen" class="screen active-screen">
        <div class="lock-time">
            <p id="lock-date">Thursday, October 22</p>
            <h1 id="lock-clock">16:53</h1>
            <p style="font-size:12px">🌐 English</p>
        </div>

        <div class="notification-center">
            <p class="section-label">NOTIFICATION CENTER</p>
            <button class="ios-notification" onclick="goToScreen('passcode-screen')">
                <div class="notif-icon">💬</div>
                <div class="notif-content">
                    <h4>Nomor Tidak Dikenal · Messages</h4>
                    <p>P... Tolongin gue. Gue kekunci di gudang sekolah.</p>
                </div>
            </button>
        </div>

        <div class="swipe-hint" onclick="goToScreen('passcode-screen')">
            Swipe up or tap to open
        </div>
    </section>

    <!-- PASSCODE -->
    <section id="passcode-screen" class="screen">
        <div class="passcode-heading">
            <h2>Enter Passcode</h2>
            <p id="passcode-error"></p>
        </div>

        <div class="dots-container">
            <div class="dot" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2<span>ABC</span></button>
            <button class="key" onclick="pressKey('3')">3<span>DEF</span></button>
            <button class="key" onclick="pressKey('4')">4<span>GHI</span></button>
            <button class="key" onclick="pressKey('5')">5<span>JKL</span></button>
            <button class="key" onclick="pressKey('6')">6<span>MNO</span></button>
            <button class="key" onclick="pressKey('7')">7<span>PQRS</span></button>
            <button class="key" onclick="pressKey('8')">8<span>TUV</span></button>
            <button class="key" onclick="pressKey('9')">9<span>WXYZ</span></button>
            <div></div>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key key-delete" onclick="clearPasscode()">Delete</button>
        </div>
    </section>

    <!-- HOME -->
    <section id="home-screen" class="screen">
        <div class="widget-row">
            <div class="ios-widget widget-date">
                <div class="day" id="widget-day">THURSDAY</div>
                <div class="date" id="widget-date">22</div>
            </div>
            <div class="ios-widget widget-weather">
                <div class="title">Weather ↗</div>
                <div class="temp">—°</div>
                <div class="desc">No forecast added</div>
            </div>
        </div>

        <div class="app-grid">
            <button class="app-icon-wrapper" onclick="openApp('photos')"><span class="app-icon icon-photos">🌸</span><span class="app-name">Photos</span></button>
            <button class="app-icon-wrapper" onclick="openApp('mail')"><span class="app-icon icon-mail">✉️</span><span class="app-name">Mail</span></button>
            <button class="app-icon-wrapper" onclick="openApp('weather')"><span class="app-icon icon-weather">☀️</span><span class="app-name">Weather</span></button>
            <button class="app-icon-wrapper" onclick="openApp('calendar')"><span class="app-icon icon-calendar">22</span><span class="app-name">Calendar</span></button>
            <button class="app-icon-wrapper" onclick="openApp('notes')"><span class="app-icon icon-notes">📝</span><span class="app-name">Notes</span></button>
            <button class="app-icon-wrapper" onclick="openApp('maps')"><span class="app-icon icon-maps">🗺️</span><span class="app-name">Maps</span></button>
            <button class="app-icon-wrapper" onclick="openApp('x')"><span class="app-icon icon-x">𝕏</span><span class="app-name">X</span></button>
            <button class="app-icon-wrapper" onclick="openApp('settings')"><span class="app-icon icon-settings">⚙️</span><span class="app-name">Settings</span></button>
            <button class="app-icon-wrapper" onclick="openApp('camera')"><span class="app-icon icon-camera">📷</span><span class="app-name">Camera</span></button>
            <button class="app-icon-wrapper" onclick="openApp('clock')"><span class="app-icon icon-clock">⏰</span><span class="app-name">Clock</span></button>
            <button class="app-icon-wrapper" onclick="openApp('journal')"><span class="app-icon icon-journal">📔</span><span class="app-name">Journal</span></button>
            <button class="app-icon-wrapper" onclick="openApp('instagram')"><span class="app-icon icon-instagram">📸</span><span class="app-name">Instagram</span></button>
        </div>

        <div class="ios-dock">
            <button class="app-icon-wrapper" onclick="openApp('phone')"><span class="app-icon icon-phone">📞</span></button>
            <button class="app-icon-wrapper" onclick="openApp('safari')"><span class="app-icon icon-safari">🧭</span></button>
            <button class="app-icon-wrapper" onclick="openApp('whatsapp')"><span class="app-icon icon-wa">💬</span></button>
            <button class="app-icon-wrapper" onclick="openApp('music')"><span class="app-icon icon-music">🎵</span></button>
        </div>
    </section>

    <!-- APP WINDOW -->
    <section id="app-window" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="goToScreen('home-screen')">‹ Back</button>
            <div class="app-header-title" id="app-chat-name">App</div>
        </header>

        <div id="app-content"></div>
        <div id="wa-chat-body" class="chat-body" style="display:none"></div>
        <div id="wa-choices-area" class="chat-input-area" style="display:none"></div>
    </section>

    <div class="home-bar" onclick="handleHomeButton()"></div>
</div>

<script>
"use strict";

const CORRECT_PASSCODE = "2210";
let currentInput = "";
let storyRun = 0;

const auStory = {
    start: {
        name: "0812-334X-XXXX",
        messages: [
            { type: "system", text: "23:42" },
            { type: "incoming", text: "P" },
            { type: "incoming", text: "Tolongin gue... Siapapun yang megang nomor ini." },
            { type: "incoming", text: "Gue kekunci di Lab Kimia lama. Ada orang di luar bawa pisau, dia nyariin gue." }
        ],
        choices: [
            { text: "💬 Balas: 'Ini siapa? Jangan nge-prank malam-malam!'", nextNode: "balasPrank" },
            { text: "🚫 Abaikan & langsung blokir nomornya.", nextNode: "endingBlokir" }
        ]
    },

    balasPrank: {
        messages: [
            { type: "outgoing", text: "Ini siapa? Jangan nge-prank malam-malam!" },
            { type: "incoming", text: "Gue Karin, anak OSIS! Sumpah demi Tuhan ini bukan prank." },
            { type: "incoming", text: "Lampu sekolah dimatiin semua. Langkah kakinya makin deket ke pintu Lab..." }
        ],
        choices: [
            { text: "📞 'Gue telepon Pak Doni (Satpam) sekarang!'", nextNode: "teleponSatpam" },
            { text: "🤫 'Sembunyi di lemari belakang! Gue jalan ke sana.'", nextNode: "nekatKeSekolah" }
        ]
    },

    teleponSatpam: {
        messages: [
            { type: "outgoing", text: "Gue telepon Pak Doni (Satpam) sekarang!" },
            { type: "system", text: "Anda mencoba menghubungi Pak Doni..." },
            { type: "system", text: "Nomor yang dituju tidak aktif." },
            { type: "incoming", text: "GAK BISA! Pak Doni udah pingsan di pos tadi gue liat 😭" },
            { type: "incoming", text: "PINTUNYA MULAI DIDOBRAK!" }
        ],
        choices: [
            { text: "🚨 Panggil Polisi sekarang juga", nextNode: "endingPolisi" },
            { text: "🏃 Nekat lari ke sekolah bawa kayu", nextNode: "endingHoror" }
        ]
    },

    nekatKeSekolah: {
        messages: [
            { type: "outgoing", text: "Sembunyi di lemari belakang! Gue jalan ke sana." },
            { type: "incoming", text: "Oke... gue masuk lemari. Buruan plis, napas gue sesak..." },
            { type: "system", text: "Anda sampai di Lab Kimia. Pintu terbuka lebar, pecahan kaca berserakan. Lemari terkunci dari luar." }
        ],
        choices: [
            { text: "🔓 Buka paksa lemarinya", nextNode: "endingSelamat" },
            { text: "🔍 Cari petunjuk di meja guru", nextNode: "endingJebakan" }
        ]
    },

    endingBlokir: {
        messages: [
            { type: "system", text: "❌ ENDING: IGNORED IGNORANCE" },
            { type: "system", text: "Keesokan paginya, sekolah gempar. Karin menghilang tanpa jejak. Anda dihantui rasa bersalah." }
        ],
        choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
    },

    endingPolisi: {
        messages: [
            { type: "system", text: "🏆 ENDING: THE TRUE SAVIOR" },
            { type: "system", text: "Polisi berhasil meringkus pelaku. Karin selamat meski trauma berat. Kamu pahlawan malam ini!" }
        ],
        choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
    },

    endingHoror: {
        messages: [
            { type: "system", text: "💀 ENDING: DOUBLE CASUALTY" },
            { type: "system", text: "Kamu diserang dari belakang di koridor gelap sebelum mencapai lab. GAME OVER." }
        ],
        choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
    },

    endingSelamat: {
        messages: [
            { type: "system", text: "🏅 ENDING: HEROIC RESCUE" },
            { type: "system", text: "Kamu mendobrak lemari dan menyelamatkan Karin tepat waktu. Kalian berhasil kabur bersama!" }
        ],
        choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
    },

    endingJebakan: {
        messages: [
            { type: "system", text: "🕸️ ENDING: IT'S A TRAP" },
            { type: "system", text: "Di lemari bukan Karin, melainkan boneka perekam suara. Pintu lab tertutup otomatis. Kamu terjebak." }
        ],
        choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
    }
};

function goToScreen(screenId) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active-screen");
    });

    const target = document.getElementById(screenId);
    if (target) target.classList.add("active-screen");
}

function handleHomeButton() {
    storyRun++;
    const active = document.querySelector(".screen.active-screen");
    if (!active) return;

    if (active.id === "lock-screen") {
        goToScreen("passcode-screen");
    } else if (active.id === "passcode-screen") {
        clearPasscode();
        goToScreen("lock-screen");
    } else if (active.id === "app-window") {
        goToScreen("home-screen");
    } else {
        goToScreen("lock-screen");
    }
}

function pressKey(num) {
    if (currentInput.length >= 4) return;

    currentInput += num;
    document.getElementById("dot" + (currentInput.length - 1))
        .classList.add("filled");

    if (currentInput.length === 4) {
        setTimeout(() => {
            if (currentInput === CORRECT_PASSCODE) {
                document.getElementById("passcode-error").textContent = "";
                clearPasscode();
                goToScreen("home-screen");
            } else {
                document.getElementById("passcode-error").textContent = "Wrong Passcode!";
                clearPasscode();
            }
        }, 250);
    }
}

function clearPasscode() {
    currentInput = "";
    for (let i = 0; i < 4; i++) {
        document.getElementById("dot" + i).classList.remove("filled");
    }
}

function renderChatNode(nodeKey) {
    const node = auStory[nodeKey];
    if (!node) return;

    const runId = ++storyRun;
    const chatBody = document.getElementById("wa-chat-body");
    const choicesArea = document.getElementById("wa-choices-area");
    const chatName = document.getElementById("app-chat-name");

    chatName.textContent = node.name || "0812-334X-XXXX";
    chatBody.innerHTML = "";
    choicesArea.innerHTML = "";

    let index = 0;

    function nextMessage() {
        if (runId !== storyRun) return;

        if (index >= node.messages.length) {
            node.choices.forEach(choice => {
                const button = document.createElement("button");
                button.className = "wa-btn";
                button.textContent = choice.text;
                button.addEventListener("click", () => {
                    if (runId === storyRun) renderChatNode(choice.nextNode);
                });
                choicesArea.appendChild(button);
            });
            return;
        }

        const msg = node.messages[index++];
        const bubble = document.createElement("div");
        bubble.className = "bubble " + msg.type;
        bubble.textContent = msg.text;
        chatBody.appendChild(bubble);
        chatBody.scrollTop = chatBody.scrollHeight;

        setTimeout(nextMessage, 420);
    }

    nextMessage();
}

function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("id-ID", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });

    document.getElementById("status-time").textContent = time;
    document.getElementById("lock-clock").textContent = time;

    document.getElementById("lock-date").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric"
        });

    document.getElementById("widget-day").textContent =
        now.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase();

    document.getElementById("widget-date").textContent = now.getDate();
}

updateClock();
setInterval(updateClock, 30000);
