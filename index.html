<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b141a">
    <title>📱 AU Interaktif: The Last Message</title>

    <style>
        :root {
            --chat-bg: #0b141a;
            --text-main: #e9edef;
            --bubble-incoming: #202c33;
            --bubble-outgoing: #005c4b;
            --accent: #00a884;
            --system-msg: #182229;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
            background: #1f2c34;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 92vh;
            height: 92dvh;
            min-height: 400px;
            background: var(--chat-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 4px solid #2f3b43;
            position: relative;
        }

        .chat-header {
            background: #202c33;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2f3b43;
            flex-shrink: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            flex-shrink: 0;
            background: #536471;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .user-info {
            min-width: 0;
        }

        .user-info .name {
            font-weight: bold;
            font-size: 1rem;
            overflow-wrap: anywhere;
        }

        .user-info .status {
            font-size: 0.75rem;
            color: var(--accent);
            min-height: 15px;
        }

        .chat-body {
            flex: 1;
            min-height: 0;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            overflow-wrap: anywhere;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease forwards;
        }

        .incoming {
            background: var(--bubble-incoming);
            align-self: flex-start;
            border-top-left-radius: 0;
        }

        .outgoing {
            background: var(--bubble-outgoing);
            align-self: flex-end;
            border-top-right-radius: 0;
        }

        .system {
            background: var(--system-msg);
            color: #aebac1;
            align-self: center;
            font-size: 0.8rem;
            text-align: center;
            border-radius: 8px;
            max-width: 95%;
            padding: 7px 10px;
        }

        .choices-container {
            background: #111b21;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid #2f3b43;
            flex-shrink: 0;
            max-height: 42%;
            overflow-y: auto;
        }

        .btn-choice {
            background: #202c33;
            color: var(--text-main);
            border: 1px solid #3d4a54;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1.4;
            text-align: left;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-choice:hover,
        .btn-choice:focus-visible {
            background: #2a3942;
            border-color: var(--accent);
            outline: none;
        }

        .btn-choice:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .btn-reset {
            background: #8c1d1d;
            color: white;
            border: none;
            padding: 7px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            margin-left: auto;
            flex-shrink: 0;
        }

        .btn-reset:hover {
            background: #b32626;
        }

        .loading {
            color: #8696a0;
            font-size: 0.85rem;
            text-align: center;
            padding: 8px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
                background: var(--chat-bg);
            }

            .phone-container {
                max-width: none;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                min-height: 0;
                border: none;
                border-radius: 0;
                box-shadow: none;
            }

            .chat-body {
                padding: 16px;
            }

            .choices-container {
                padding: 12px;
                max-height: 40%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
<div class="phone-container">

    <div class="chat-header">
        <div class="avatar" id="chat-avatar">❓</div>

        <div class="user-info">
            <div class="name" id="chat-name">Nomor Tidak Dikenal</div>
            <div class="status" id="chat-status">online</div>
        </div>

        <button class="btn-reset" id="reset-button" type="button">
            Reset Game
        </button>
    </div>

    <div
        class="chat-body"
        id="chat-body"
        role="log"
        aria-live="polite"
        aria-label="Percakapan"
    ></div>

    <div class="choices-container" id="choices-container"></div>
</div>

            {
                type: "system",

            {
                type: "system",
                text: "Di atas meja ada HP Karin yang menyala. Tiba-tiba pintu Lab menutup otomatis dan terkunci. Di dalam lemari bukan Karin, melainkan sebuah boneka perekam suara..."

const chatBody = document.getElementById("chat-body");
const choicesContainer = document.getElementById("choices-container");
const chatName = document.getElementById("chat-name");
const chatStatus = document.getElementById("chat-status");
const chatAvatar = document.getElementById("chat-avatar");
const resetButton = document.getElementById("reset-button");

let timers = [];
let currentRun = 0;
let isRendering = false;

function schedule(callback, delay, runId) {
    const timer = setTimeout(() => {
        if (runId === currentRun) {
            callback();
        }
    }, delay);

    timers.push(timer);
}

function clearTimers() {
    timers.forEach(clearTimeout);
    timers = [];
}

function appendBubble(text, type) {
    const bubble = document.createElement("div");
    bubble.classList.add("bubble", type);
    bubble.textContent = text;

    chatBody.appendChild(bubble);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function showChoices(choices, runId) {
    if (runId !== currentRun) return;

    choicesContainer.innerHTML = "";

    choices.forEach(choice => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "btn-choice";
        button.textContent = choice.text;

        button.addEventListener("click", () => {
            if (isRendering || runId !== currentRun) return;

            if (!storyData[choice.nextNode]) {
                console.error("Node cerita tidak ditemukan:", choice.nextNode);
                return;
            }

            renderNode(choice.nextNode);
        });

        choicesContainer.appendChild(button);
    });

    isRendering = false;
    chatBody.scrollTop = chatBody.scrollHeight;
}

function renderNode(nodeKey) {
    const node = storyData[nodeKey];

    if (!node) {
        console.error("Cerita tidak ditemukan:", nodeKey);
        return;
    }

    clearTimers();
    const runId = ++currentRun;
    isRendering = true;

    chatBody.innerHTML = "";
    choicesContainer.innerHTML = "";

    chatName.textContent = node.name || "0812-334X-XXXX";
    chatAvatar.textContent = node.avatar || "❓";
    chatStatus.textContent = "online";

    const loading = document.createElement("div");
    loading.className = "loading";
    loading.textContent = "Memuat percakapan...";
    chatBody.appendChild(loading);

    let index = 0;
    const messages = node.messages || [];

    function displayNextMessage() {
        if (runId !== currentRun) return;

        loading.remove();

        if (index >= messages.length) {
            chatStatus.textContent = "online";
            showChoices(node.choices || [], runId);
            return;
        }

        const msg = messages[index++];

        if (msg.type === "incoming") {
            chatStatus.textContent = "mengetik...";
        } else {
            chatStatus.textContent = "online";
        }

        appendBubble(msg.text, msg.type);

        schedule(() => {
            chatStatus.textContent = "online";
            displayNextMessage();
        }, msg.type === "system" ? 500 : 850, runId);
    }

    schedule(displayNextMessage, 400, runId);
}

function resetGame() {
    clearTimers();
    currentRun++;
    isRendering = false;
    renderNode("start");
}

resetButton.addEventListener("click", resetGame);

window.addEventListener("DOMContentLoaded", () => {
    renderNode("start");
});
</script>

</html>
