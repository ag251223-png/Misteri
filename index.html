            ],

        endingJebakan: {

                { type: "system", text: "Kamu memeriksa meja guru..." },
                { type: "system", text: "🕸️ ENDING: IT'S A TRAP" },
                { type: "system", text: "Di atas meja ada HP Karin yang menyala. Tiba-tiba pintu Lab menutup otomatis dan terkunci. Di dalam lemari bukan Karin, melainkan sebuah boneka perekam suara..." }
            ],
            choices: [{ text: "🔄 Ulangi Cerita", nextNode: "start" }]
        }
    };

    let chatBody = document.getElementById('chat-body');
    let choicesContainer = document.getElementById('choices-container');
    let chatName = document.getElementById('chat-name');
    let chatStatus = document.getElementById('chat-status');

    function resetGame() {
        chatBody.innerHTML = '';
        renderNode('start');
    }

    function renderNode(nodeKey) {
        const node = storyData[nodeKey];
        chatBody.innerHTML = ''; 
        choicesContainer.innerHTML = ''; 
        
        if (node.name) {
            chatName.innerText = node.name;
        } else {
            chatName.innerText = "0812-334X-XXXX";
        }

        let delay = 0;
        node.messages.forEach((msg) => {
            delay += 800; 
            
            setTimeout(() => {
                if (msg.type === 'incoming') {
                    chatStatus.innerText = 'typing...';
                    setTimeout(() => { chatStatus.innerText = 'online'; }, 500);
                }
                appendBubble(msg.text, msg.type);
            }, delay);
        });

        setTimeout(() => {
            node.choices.forEach(choice => {
                const button = document.createElement('button');
                button.innerText = choice.text;
                button.classList.add('btn-choice');
                button.onclick = () => {
                    renderNode(choice.nextNode);
                };
                choicesContainer.appendChild(button);
            });
        }, delay + 500);
    }

    function appendBubble(text, type) {
        const bubble = document.createElement('div');
        bubble.classList.add('bubble', type);
        bubble.innerText = text;
        chatBody.appendChild(bubble);
        chatBody.scrollTop = chatBody.scrollHeight;
    }

    // Selalu paksa jalankan dari titik paling awal saat web dibuka
    window.onload = function() {
        resetGame();
    };
</script>
