<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202b38">
<title>iOS AU Simulator</title>

<style>
:root {
    --green: #25D366;
    --glass: rgba(255,255,255,.17);
    --dark: #101820;
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #151a20;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, sans-serif;
}

button {
    font: inherit;
    color: inherit;
    cursor: pointer;
}

.phone-container {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 92vh;
    height: 92dvh;
    min-height: 480px;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 20% 15%, #aab9c9 0%, transparent 38%),
        radial-gradient(ellipse at 85% 65%, #8b9eaf 0%, transparent 38%),
        linear-gradient(145deg, #526477, #202d3b 60%, #111b27);
    border: 5px solid #34373d;
    border-radius: 42px;
    box-shadow: 0 20px 60px #0009;
}

.dynamic-island {
    position: absolute;
    z-index: 100;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 105px;
    height: 29px;
    border-radius: 30px;
    background: #050505;
}

.status-bar {
    position: absolute;
    z-index: 99;
    top: 12px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    pointer-events: none;
}

.screen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    overflow: hidden;
}

.screen.active-screen {
    display: flex;
}

.lock-time {
    margin-top: 75px;
    text-align: center;
    text-shadow: 0 2px 12px #0003;
}

.lock-date {
    font-size: 16px;
    margin-bottom: 3px;
}

.lock-time h1 {
    font-size: clamp(65px, 18vw, 88px);
    font-weight: 250;
    line-height: 1.1;
    margin: 0;
    letter-spacing: -3px;
}

.lock-subtitle {
    font-size: 13px;
    opacity: .85;
    margin-top: 8px;
}

.notification-center {
    margin-top: auto;
    padding: 18px;
}

.section-label {
    font-size: 12px;
    font-weight: 700;
    margin: 0 0 8px 5px;
    opacity: .85;
}

.ios-notification {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 14px;
    border-radius: 19px;
    background: rgba(255,255,255,.2);
    border: 1px solid #ffffff25;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    text-align: left;
    width: 100%;
}

.notif-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: #25D366;
    font-size: 22px;
    flex-shrink: 0;
}

.notif-content {
    min-width: 0;
}

.notif-content h4 {
    margin: 0 0 4px;
    font-size: 13px;
}

.notif-content p {
    margin: 0;
    font-size: 12px;
    line-height: 1.45;
    opacity: .9;
}

.swipe-hint {
    text-align: center;
    padding: 0 10px 42px;
    font-size: 12px;
    opacity: .85;
    cursor: pointer;
}

/* PASSCODE */

#passcode-screen {
    align-items: center;
    background: #1d2836b8;
    backdrop-filter: blur(35px);
    -webkit-backdrop-filter: blur(35px);
}

.passcode-heading {
    margin-top: 100px;
    text-align: center;
}

.passcode-heading h2 {
    font-size: 22px;
    font-weight: 500;
    margin: 0;
}

#passcode-error {
    height: 18px;
    font-size: 12px;
    color: #ffaaaa;
    margin: 8px 0 0;
}

.dots-container {
    display: flex;
    gap: 19px;
    margin: 15px 0 28px;
}

.dot {
    width: 12px;
    height: 12px;
    border: 1.5px solid white;
    border-radius: 50%;
}

.dot.filled {
    background: white;
}

.keypad {
    display: grid;
    grid-template-columns: repeat(3, 72px);
    gap: 13px 20px;
    justify-content: center;
}

.key {
    width: 72px;
    height: 72px;
    border: 0;
    border-radius: 50%;
    background: #ffffff22;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 27px;
}

.key:active {
    background: #ffffff55;
}

.key span {
    font-size: 8px;
    letter-spacing: 1px;
    margin-top: 2px;
    opacity: .7;
}

.key-delete {
    background: transparent;
    font-size: 12px;
}

/* HOME */

#home-screen {
    padding: 65px 20px 45px;
    background:
        radial-gradient(ellipse at 20% 15%, #aab9c9 0%, transparent 38%),
        radial-gradient(ellipse at 85% 65%, #8b9eaf 0%, transparent 38%),
        linear-gradient(145deg, #526477, #202d3b 60%, #111b27);
}

.home-greeting {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin: 0 0 4px 3px;
    opacity: .8;
}

.home-title {
    font-size: 27px;
    font-weight: 600;
    margin: 0 0 22px 3px;
}

.app-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 23px 8px;
}

.app-icon-wrapper {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    border: 0;
    background: transparent;
}

.app-icon {
    width: clamp(48px, 13vw, 58px);
    height: clamp(48px, 13vw, 58px);
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 29px;
    box-shadow: 0 5px 12px #0003;
}

.app-name {
    font-size: 10px;
    text-shadow: 0 1px 4px #000;
    text-align: center;
}

.icon-wa { background: #25D366; }
.icon-ig { background: linear-gradient(135deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5); }
.icon-photos { background: #fff; }
.icon-notes { background: #fff7d6; }
.icon-settings { background: #858b95; }
.icon-mail { background: #4c9df5; }
.icon-camera { background: #d9dce0; }
.icon-phone { background: #32c65a; }

.dock {
    margin-top: auto;
    padding: 13px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    background: #ffffff2b;
    border: 1px solid #ffffff20;
    border-radius: 23px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

/* APP WINDOWS */

#app-window {
    background: #f6f6f6;
    color: #202124;
    z-index: 50;
}

.app-header {
    min-height: 76px;
    padding: 39px 14px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #202c33;
    color: white;
    flex-shrink: 0;
}

.btn-back {
    background: transparent;
    border: 0;
    color: #55d8a5;
    font-size: 16px;
    padding: 5px 0;
}

.app-header-title {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
}

.app-content {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
}

#app-window.whatsapp-mode {
    background: #0b141a;
    color: #e9edef;
}

.whatsapp-mode .app-header {
    background: #202c33;
}

.chat-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 11px;
    padding: 15px;
    background-color: #0b141a;
    background-image: radial-gradient(#ffffff08 1px, transparent 1px);
    background-size: 15px 15px;
}

.bubble {
    max-width: 88%;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
}

.incoming {
    background: #202c33;
    align-self: flex-start;
    border-top-left-radius: 3px;
}

.outgoing {
    background: #005c4b;
    align-self: flex-end;
    border-top-right-radius: 3px;
}

.chat-input-area {
    background: #111b21;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    flex-shrink: 0;
}

.wa-btn {
    background: #202c33;
    color: #e9edef;
    border: 1px solid #3d4a54;
    padding: 12px;
    border-radius: 10px;
    text-align: left;
    font-size: 12px;
    line-height: 1.45;
}

.wa-btn:active {
    background: #344650;
}

.info-card {
    border-radius: 17px;
    background: white;
    color: #252525;
    padding: 17px;
    margin-bottom: 13px;
    box-shadow: 0 3px 12px #0001;
}

.info-card h3 {
    margin: 0 0 7px;
    font-size: 16px;
}

.info-card p {
    font-size: 13px;
    line-height: 1.55;
    margin: 0;
}

.note-paper {
    background: #fff8d8;
    color: #403923;
    min-height: 180px;
    padding: 18px;
    border-radius: 10px;
    line-height: 1.7;
    font-size: 14px;
    white-space: pre-wrap;
}

.photo-placeholder {
    aspect-ratio: 1;
    border-radius: 14px;
    display: grid;
    place-items: center;
    font-size: 65px;
    background: linear-gradient(145deg, #d8dfe6, #879aaf);
    margin-bottom: 12px;
}

.setting-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: white;
    padding: 14px;
    color: #242424;
    border-radius: 12px;
    margin-bottom: 9px;
    font-size: 13px;
}

.home-bar {
    position: absolute;
    z-index: 120;
    bottom: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 115px;
    height: 5px;
    border-radius: 5px;
    background: white;
    cursor: pointer;
}

@media (max-width: 480px) {
    body {
        background: #111b21;
    }

    .phone-container {
        max-width: none;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        min-height: 0;
        border: 0;
        border-radius: 0;
    }
}

@media (max-height: 650px) {
    .lock-time { margin-top: 58px; }
    .lock-time h1 { font-size: 62px; }
    .passcode-heading { margin-top: 65px; }
    .keypad { gap: 8px 18px; }
    .key { width: 59px; height: 59px; }
    .app-grid { gap: 13px 8px; }
}
</style>
</head>

<body>
<div class="phone-container">

    <div class="status-bar">
        <span id="status-time">16:53</span>
        <span>● ▮▮▮  Wi-Fi ▰</span>
    </div>

    <div class="dynamic-island"></div>

    <!-- LOCK SCREEN -->
    <section id="lock-screen" class="screen active-screen">
        <div class="lock-time">
            <div class="lock-date" id="lock-date">Thursday, October 22</div>
            <h1 id="lock-clock">16:53</h1>
            <div class="lock-subtitle">🌐 English</div>
        </div>

        <div class="notification-center">
            <p class="section-label">NOTIFICATION CENTER</p>
            <button class="ios-notification" onclick="goToScreen('passcode-screen')">
                <div class="notif-icon">💬</div>
                <div class="notif-content">
                    <h4>Bibi · Messages</h4>
                    <p>Dhika, bibi harap, kamu dan kedua sepupumu itu jaga sikap.</p>
                </div>
            </button>
        </div>

        <div class="swipe-hint" onclick="goToScreen('passcode-screen')">
            Tap to unlock
        </div>
    </section>

    <!-- PASSCODE SCREEN -->
    <section id="passcode-screen" class="screen">
        <div class="passcode-heading">
            <h2>Enter Passcode</h2>
            <p id="passcode-error"></p>
        </div>

        <div class="dots-container">
            <div class="dot" id="dot0"></div>
            <div class="dot" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2<span>ABC</span></button>
            <button class="key" onclick="pressKey('3')">3<span>DEF</span></button>
            <button class="key" onclick="pressKey('4')">4<span>GHI</span></button>
            <button class="key" onclick="pressKey('5')">5<span>JKL</span></button>
            <button class="key" onclick="pressKey('6')">6<span>MNO</span></button>
            <button class="key" onclick="pressKey('7')">7<span>PQRS</span></button>
            <button class="key" onclick="pressKey('8')">8<span>TUV</span></button>
            <button class="key" onclick="pressKey('9')">9<span>WXYZ</span></button>
            <div></div>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key key-delete" onclick="clearPasscode()">Delete</button>
        </div>
    </section>

    <!-- HOME SCREEN -->
    <section id="home-screen" class="screen">
        <p class="home-greeting">Thursday afternoon</p>
        <h2 class="home-title">Dhika's iPhone</h2>

        <div class="app-grid">
            <button class="app-icon-wrapper" onclick="openApp('whatsapp')">
                <span class="app-icon icon-wa">💬</span>
                <span class="app-name">WhatsApp</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('instagram')">
                <span class="app-icon icon-ig">📸</span>
                <span class="app-name">Instagram</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('photos')">
                <span class="app-icon icon-photos">🌈</span>
                <span class="app-name">Photos</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('notes')">
                <span class="app-icon icon-notes">📝</span>
                <span class="app-name">Notes</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('settings')">
                <span class="app-icon icon-settings">⚙️</span>
                <span class="app-name">Settings</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('mail')">
                <span class="app-icon icon-mail">✉️</span>
                <span class="app-name">Mail</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('camera')">
                <span class="app-icon icon-camera">📷</span>
                <span class="app-name">Camera</span>
            </button>

            <button class="app-icon-wrapper" onclick="openApp('phone')">
                <span class="app-icon icon-phone">☎️</span>
                <span class="app-name">Phone</span>
            </button>
        </div>

        <div class="dock">
            <button class="app-icon-wrapper" onclick="openApp('phone')">
                <span class="app-icon icon-phone">☎️</span>
            </button>
            <button class="app-icon-wrapper" onclick="openApp('whatsapp')">
                <span class="app-icon icon-wa">💬</span>
            </button>
            <button class="app-icon-wrapper" onclick="openApp('photos')">
                <span class="app-icon icon-photos">🌈</span>
            </button>
            <button class="app-icon-wrapper" onclick="openApp('mail')">
                <span class="app-icon icon-mail">✉️</span>
            </button>
        </div>
    </section>

    <!-- APP WINDOW -->
    <section id="app-window" class="screen">
        <header class="app-header">
            <button class="btn-back" onclick="goToScreen('home-screen')">‹ Back</button>
            <div class="app-header-title" id="app-title">App</div>
        </header>

        <div id="app-content" class="app-content"></div>

        <div id="wa-chat-body" class="chat-body" style="display:none"></div>
        <div id="wa-choices-area" class="chat-input-area" style="display:none"></div>
    </section>

    <div class="home-bar" onclick="handleHomeButton()"></div>
</div>

<script>
"use strict";

const CORRECT_PASSCODE = "2210";
let currentInput = "";
let chatRun = 0;

const auStory = {
    start: {
        messages: [
            {
                type: "incoming",
                text: "Dhika, bibi harap, kamu dan kedua sepupumu itu jaga sikap."
            },
            {
                type: "incoming",
                text: "Jangan bikin malu keluarga besar di acara nanti malam. Paham?"
            }
        ],
        choices: [
            {
                text: "💬 'Iya Bi, Dhika paham kok. Aman.'",
                nextNode: "ruteAman"
            },
            {
                text: "💬 'Emang sepupu Dhika bikin ulah apa lagi, Bi?'",
                nextNode: "ruteMisteri"
            }
        ]
    },

    ruteAman: {
        messages: [
            {
                type: "outgoing",
                text: "Iya Bi, Dhika paham kok. Aman."
            },
            {
                type: "incoming",
                text: "Bagus. Oiya, tolong cek lemari kamar tamu, pastikan dikunci. Ada berkas penting di sana."
            }
        ],
        choices: [
            {
                text: "🔄 Ulangi Chat",
                nextNode: "start"
            }
        ]
    },

    ruteMisteri: {
        messages: [
            {
                type: "outgoing",
                text: "Emang sepupu Dhika bikin ulah apa lagi, Bi?"
            },
            {
                type: "incoming",
                text: "Mereka berdua ketahuan sembunyiin kunci gudang belakang."
            },
            {
                type: "incoming",
                text: "Bibi curiga mereka ngerencanain sesuatu yang aneh..."
            }
        ],
        choices: [
            {
                text: "🔄 Ulangi Chat",
                nextNode: "start"
            }
        ]
    }
};

function goToScreen(screenId) {
    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active-screen");
    });

    const target = document.getElementById(screenId);
    if (target) target.classList.add("active-screen");
}

function handleHomeButton() {
    const active = document.querySelector(".screen.active-screen");

    if (!active) return;

    if (active.id === "passcode-screen") {
        clearPasscode();
        goToScreen("lock-screen");
    } else if (active.id === "app-window") {
        chatRun++;
        goToScreen("home-screen");
    } else if (active.id === "home-screen") {
        goToScreen("lock-screen");
    } else {
        goToScreen("passcode-screen");
    }
}

function pressKey(num) {
    if (currentInput.length >= 4) return;

    currentInput += num;
    document.getElementById("dot" + (currentInput.length - 1))
        .classList.add("filled");

    if (currentInput.length === 4) {
        setTimeout(() => {
            if (currentInput === CORRECT_PASSCODE) {
                document.getElementById("passcode-error").textContent = "";
                clearPasscode();
                goToScreen("home-screen");
            } else {
                document.getElementById("passcode-error").textContent =
                    "Wrong Passcode. Try again.";
                clearPasscode();
            }
        }, 250);
    }
}

function clearPasscode() {
    currentInput = "";

    for (let i = 0; i < 4; i++) {
        document.getElementById("dot" + i).classList.remove("filled");
    }
}

function openApp(appName) {
    chatRun++;

    const appWindow = document.getElementById("app-window");
    const appTitle = document.getElementById("app-title");
    const appContent = document.getElementById("app-content");
    const chatBody = document.getElementById("wa-chat-body");
    const choicesArea = document.getElementById("wa-choices-area");

    appContent.style.display = "block";
    chatBody.style.display = "none";
    choicesArea.style.display = "none";

    appWindow.classList.remove("whatsapp-mode");

    const apps = {
        instagram: {
            title: "Instagram",
            html: `
                <div class="info-card">
                    <h3>📸 dhika.archive</h3>
                    <p>close friends, random days & little memories.</p>
                </div>
                <div class="info-card">
                    <div class="photo-placeholder">🌅</div>
                    <h3>last evening</h3>
                    <p>Some family gatherings never feel simple.</p>
                </div>
                <div class="info-card">
                    <h3>💬 Close Friends Story</h3>
                    <p>“Kenapa semua orang kayak nyembunyiin sesuatu dari gue?”</p>
                </div>`
        },

        photos: {
            title: "Photos",
            html: `
                <div class="info-card">
                    <h3>Recents</h3>
                    <div class="photo-placeholder">🏡</div>
                    <p>Family House · 4:42 PM</p>
                </div>
                <div class="info-card">
                    <div class="photo-placeholder">🔑</div>
                    <h3>IMG_2210</h3>
                    <p>Sebuah foto kunci gudang belakang yang tidak sengaja terambil.</p>
                </div>`
        },

        notes: {
            title: "Notes",
            html: `
                <div class="note-paper" contenteditable="true">
Catatan Dhika

Acara keluarga malam ini.

- Bibi terus mengingatkan soal sikap.
- Ada berkas penting di lemari kamar tamu.
- Kenapa sepupu-sepupuku menyembunyikan kunci gudang?

Aku harus cari tahu sendiri.
                </div>
                <p style="font-size:11px;color:#ddd;margin-top:10px">
                Catatan simulasi. Perubahan tidak disimpan setelah halaman ditutup.
                </p>`
        },

        settings: {
            title: "Settings",
            html: `
                <div class="setting-row">👤 &nbsp; Apple Account</div>
                <div class="setting-row">📶 &nbsp; Wi-Fi · Connected</div>
                <div class="setting-row">🔵 &nbsp; Bluetooth · On</div>
                <div class="setting-row">🔒 &nbsp; Face ID & Passcode</div>
                <div class="info-card">
                    <h3>About this iPhone</h3>
                    <p>AU Simulator · Interactive Story</p>
                </div>`
        },

        mail: {
            title: "Mail",
            html: `
                <div class="info-card">
                    <p style="color:#777;font-size:11px">TODAY · 3:15 PM</p>
                    <h3>Family Gathering — Reminder</h3>
                    <p>From: Family Committee</p>
                    <p style="margin-top:12px">Mohon seluruh anggota keluarga hadir tepat waktu. Ada pengumuman penting malam ini.</p>
                </div>
                <div class="info-card">

    if (appName === "whatsapp") {
        appTitle.textContent = "Bibi";
        appWindow.classList.add("whatsapp-mode");
        appContent.style.display = "none";
        chatBody.style.display = "flex";
        choicesArea.style.display = "flex";

        renderChatNode("start");
    } else {
        const app = apps[appName];

        if (!app) return;

        appTitle.textContent = app.title;
        appContent.innerHTML = app.html;
    }

    goToScreen("app-window");
}

function renderChatNode(nodeKey) {
    const node = auStory[nodeKey];

    if (!node) return;

    const runId = ++chatRun;
    const chatBody = document.getElementById("wa-chat-body");
    const choicesArea = document.getElementById("wa-choices-area");

    chatBody.innerHTML = "";
    choicesArea.innerHTML = "";

    const messages = node.messages || [];
    let index = 0;

    function showNextMessage() {
        if (runId !== chatRun) return;

        if (index >= messages.length) {
            showChoices();
            return;
        }

        const msg = messages[index++];
        const bubble = document.createElement("div");

        bubble.className = "bubble " + msg.type;
        bubble.textContent = msg.text;

        chatBody.appendChild(bubble);
        chatBody.scrollTop = chatBody.scrollHeight;

        setTimeout(showNextMessage, 350);
    }

    function showChoices() {
        if (runId !== chatRun) return;

        choicesArea.innerHTML = "";

        (node.choices || []).forEach(choice => {
            const button = document.createElement("button");
            button.className = "wa-btn";
            button.textContent = choice.text;

            button.addEventListener("click", () => {
                if (runId === chatRun) {
                    renderChatNode(choice.nextNode);
                }
            });

            choicesArea.appendChild(button);
        });
    }

    showNextMessage();
}

/* Clock and date */
function updateClock() {
    const now = new Date();

    document.getElementById("status-time").textContent =
        now.toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });

    document.getElementById("lock-clock").textContent =
        now.toLocaleTimeString("id-ID", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false
        });

    document.getElementById("lock-date").textContent =
        now.toLocaleDateString("en-US", {
            weekday: "long",
            month: "long",
            day: "numeric"
        });
}

updateClock();
setInterval(updateClock, 30000);
